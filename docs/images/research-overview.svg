<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Cerebral aneurysm research</title><desc id="desc">Four stages: web visualization, virtual reality, multimodal modeling, and generalization across patients, datasets, and locations.</desc>
<rect width="1200" height="410" rx="14" fill="#102d3a"/>
<g font-family="Arial, sans-serif"><text x="48" y="55" fill="#8bd5c7" font-size="14" letter-spacing="3">ESHAN VIPUIL · RESEARCH</text>
<text x="48" y="110" fill="#ffffff" font-size="36" font-weight="700">Cerebral aneurysms</text>
<text x="48" y="145" fill="#c0d5dd" font-size="20">Blood-flow visualization, multimodal modeling, and generalization</text>
<path d="M70 207 H1125" stroke="#4b747e" stroke-width="2"/>
<circle cx="58" cy="207" r="6" fill="#8bd5c7"/><text x="48" y="245" fill="#8bd5c7" font-size="13" letter-spacing="2">YEAR 1</text><text x="48" y="281" fill="#ffffff" font-size="21" font-weight="700">Web visualization</text><text x="48" y="317" fill="#c0d5dd" font-size="17">Vascular geometry</text><text x="48" y="342" fill="#c0d5dd" font-size="17">and simulated blood flow</text><circle cx="342" cy="207" r="6" fill="#8bd5c7"/><text x="332" y="245" fill="#8bd5c7" font-size="13" letter-spacing="2">YEAR 2</text><text x="332" y="281" fill="#ffffff" font-size="21" font-weight="700">Virtual reality</text><text x="332" y="317" fill="#c0d5dd" font-size="17">Explore flow patterns</text><text x="332" y="342" fill="#c0d5dd" font-size="17">in three dimensions</text><circle cx="626" cy="207" r="6" fill="#8bd5c7"/><text x="616" y="245" fill="#8bd5c7" font-size="13" letter-spacing="2">YEAR 3</text><text x="616" y="281" fill="#ffffff" font-size="21" font-weight="700">Multimodal models</text><text x="616" y="317" fill="#c0d5dd" font-size="17">Combine geometry, flow,</text><text x="616" y="342" fill="#c0d5dd" font-size="17">and clinical variables</text><circle cx="910" cy="207" r="6" fill="#8bd5c7"/><text x="900" y="245" fill="#8bd5c7" font-size="13" letter-spacing="2">YEAR 4</text><text x="900" y="281" fill="#ffffff" font-size="21" font-weight="700">Generalization</text><text x="900" y="317" fill="#c0d5dd" font-size="17">Hold out patients, datasets,</text><text x="900" y="342" fill="#c0d5dd" font-size="17">and anatomical locations</text></g></svg>